spring.application.name=apicalendariolaboral
server.port=${SERVER_PORT:8081}

# Los valores por defecto sirven para ejecución local (sin Docker).
# En Docker Compose se sobrescriben con variables de entorno (nombres de servicio, no localhost).
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/calendariolaboral}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sa}

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# URL base de la API de festivos
servicio-externo.festivos.url=${SERVICIO_EXTERNO_FESTIVOS_URL:http://localhost:3030/api/festivos}
